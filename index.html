<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'VT323', monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            position: relative;
            background-color: #000;
        }

        /* --- BACKGROUND VIDEO --- */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.5);
        }

        /* --- HEADER DI ATAS TENGAH --- */
        h1 {
            position: absolute;
            top: 10%;
            width: 100%;
            color: #ff4757; 
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin: 0;
            z-index: 100;
            letter-spacing: 2px;
        }

        /* --- CONTAINER BULAN (SEBAGAI TOMBOL) --- */
        .moon-container {
            width: 85vw;
            max-width: 380px;
            aspect-ratio: 1 / 1; 
            border-radius: 50%;
            background-image: url('bulan.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 0 50px rgba(255, 255, 230, 0.3), inset 0 0 30px rgba(0,0,0,0.5);
            
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box; 
            z-index: 10;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* Efek saat bulan ditekan */
        .moon-container:active {
            transform: scale(0.95);
            box-shadow: 0 0 30px rgba(255, 255, 230, 0.2);
        }

        /* --- TEKS PESAN --- */
        #message {
            font-size: 1.7em;
            color: #ffffff; 
            line-height: 1.2;
            text-align: center;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 1), 0px 0px 10px rgba(0,0,0,0.8);
            opacity: 0; /* Awalnya tidak terlihat */
            transition: opacity 0.4s ease;
            pointer-events: none; /* Klik tembus ke container bulan */
            font-weight: normal;
        }
    </style>
</head>
<body>
    <video autoplay loop muted playsinline id="bg-video">
        <source src="background.mp4" type="video/mp4">
    </video>

    <h1>Hai, Sayang ❤️</h1>

    <div class="moon-container" onclick="tampilkanPesan()">
        <div id="message"></div>
    </div>

    <audio id="bg-music" loop>
        <source src="lagu.mp3" type="audio/mpeg">
    </audio>

    <script>
        const pesan = [
            "Aku kangen kamu hari ini.",
            "Jarak cuma angka, perasaanku ke kamu nyata.",
            "Semangat ya hari ini! You got this.",
            "Jangan lupa makan yang bener, aku nggak mau kamu sakit.",
            "Senyum kamu itu hal favorit aku di dunia.",
            "Semoga mimpi indah ya nanti malam, Sayang.",
            "Aku selalu bangga punya kamu.",
            "Inget ya, aku di sini selalu dukung kamu.",
            "Setiap detik tanpamu terasa sangat lama.",
            "Aku sudah siapkan banyak pelukan saat kita bertemu nanti."
            // Tambahkan terus sampai 500 kalimat...
        ];

        let pertamaKaliKlik = true;

        function tampilkanPesan() {
            // Paksa musik dan video jalan saat klik pertama
            const musik = document.getElementById('bg-music');
            const video = document.getElementById('bg-video');
            
            if (musik && musik.paused) musik.play();
            if (video && video.paused) video.play();

            const messageElement = document.getElementById('message');
            const indexRandom = Math.floor(Math.random() * pesan.length);

            if (pertamaKaliKlik) {
                // Langsung munculkan pesan tanpa transisi lama di klik pertama
                messageElement.innerText = pesan[indexRandom];
                messageElement.style.opacity = 1;
                pertamaKaliKlik = false;
            } else {
                // Transisi halus untuk klik selanjutnya
                messageElement.style.opacity = 0;
                setTimeout(() => {
                    messageElement.innerText = pesan[indexRandom];
                    messageElement.style.opacity = 1;
                }, 250);
            }
        }
    </script>
</body>
</html>
