<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'VT323', monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            position: relative;
            background-color: #000;
        }

        /* --- BACKGROUND VIDEO --- */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.5);
        }

        /* --- HEADER DI ATAS TENGAH --- */
        h1 {
            position: absolute;
            top: 10%; /* Dikembalikan ke 10% */
            width: 100%;
            color: #ff4757; 
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), 0 0 5px rgba(255, 255, 255, 0.3);
            margin: 0;
            z-index: 100;
            letter-spacing: 2px;
        }

        /* --- CONTAINER BULAN (KEMBALI BULAT SEMPURNA) --- */
        .moon-container {
            width: 85vw;
            max-width: 380px;
            
            /* Dikembalikan ke bentuk lingkaran */
            aspect-ratio: 1 / 1; 
            border-radius: 50%; 
            
            background-image: url('bulan.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 0 50px rgba(255, 255, 230, 0.3), inset 0 0 30px rgba(0,0,0,0.5);
            
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box; 
            z-index: 10;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .moon-container:active {
            transform: scale(0.95);
            box-shadow: 0 0 30px rgba(255, 255, 230, 0.2);
        }

        /* --- TEKS PESAN --- */
        #message {
            font-size: 1.7em;
            color: #ffffff; 
            line-height: 1.2;
            text-align: center;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 1), 0px 0px 10px rgba(0,0,0,0.8);
            opacity: 0; 
            transition: opacity 0.4s ease;
            pointer-events: none; 
            font-weight: normal;
        }

        /* --- COUNTER DAYS --- */
        .day-counter {
            position: absolute;
            bottom: 5%;
            width: 100%;
            color: #ffffff;
            font-size: 1.5em;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px; 
        }
    </style>
</head>
<body>
    <video autoplay loop muted playsinline id="bg-video">
        <source src="background.mp4" type="video/mp4">
    </video>

    <h1>Hai, Lunar 🖤</h1>

    <div class="moon-container" onclick="handleMoonClick()">
        <div id="message"></div>
    </div>

    <div class="day-counter">
        <span>🖤</span> <span id="days-count">129</span>
    </div>

    <audio id="bg-music" loop>
        <source src="lagu.mp3" type="audio/mpeg">
    </audio>

    <script>
        const pesan = [
            "Aku kangen kamu hari ini.",
            "Jarak cuma angka, perasaanku ke kamu nyata.",
            "Semangat ya hari ini! You got this.",
            "Jangan lupa makan yang bener, aku nggak mau kamu sakit.",
            "Senyum kamu itu hal favorit aku di dunia.",
            "Semoga mimpi indah ya nanti malam, Sayang.",
            "Aku selalu bangga punya kamu.",
            "Inget ya, aku di sini selalu dukung kamu.",
            "Setiap detik tanpamu terasa sangat lama.",
            "Aku sudah siapkan banyak pelukan saat kita bertemu nanti."
            // Tambahkan terus sampai 500 kalimat...
        ];

        let pertamaKaliKlik = true;

        function dapatkanPesanHariIni() {
            const hariIni = new Date();
            const seedString = hariIni.getFullYear().toString() + hariIni.getMonth().toString() + hariIni.getDate().toString();
            let seed = parseInt(seedString);
            
            let x = Math.sin(seed++) * 10000;
            const indexHariIni = Math.floor((x - Math.floor(x)) * pesan.length);
            return pesan[indexHariIni];
        }

        function handleMoonClick() {
            const musik = document.getElementById('bg-music');
            const video = document.getElementById('bg-video');
            if (musik && musik.paused) musik.play();
            if (video && video.paused) video.play();

            const messageElement = document.getElementById('message');

            if (pertamaKaliKlik) {
                messageElement.innerText = dapatkanPesanHariIni();
                messageElement.style.opacity = 1;
                pertamaKaliKlik = false;
            } else {
                const indexRandom = Math.floor(Math.random() * pesan.length);
                messageElement.style.opacity = 0;
                setTimeout(() => {
                    messageElement.innerText = pesan[indexRandom];
                    messageElement.style.opacity = 1;
                }, 250);
            }
        }

        function hitungHari() {
            const tanggalMulai = new Date("2026-05-30"); 
            const hariMulaiNilai = 129; 
            
            const hariIni = new Date();
            
            tanggalMulai.setHours(0,0,0,0);
            hariIni.setHours(0,0,0,0);
            
            const selisihWaktu = hariIni.getTime() - tanggalMulai.getTime();
            const selisihHari = Math.floor(selisihWaktu / (1000 * 60 * 60 * 24));
            
            document.getElementById('days-count').innerText = hariMulaiNilai + selisihHari;
        }

        window.onload = function() {
            hitungHari();
        };
    </script>
</body>
</html>
