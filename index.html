<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for her</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'VT323', monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            position: relative;
            background-color: #000;
        }

        /* --- BACKGROUND VIDEO --- */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.5);
        }

        /* --- HEADER DI ATAS TENGAH --- */
        h1 {
            position: absolute;
            top: 10%; 
            width: 100%;
            color: #ff4757; 
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), 0 0 5px rgba(255, 255, 255, 0.3);
            margin: 0;
            z-index: 100;
            letter-spacing: 2px;
            pointer-events: none; 
        }

        /* --- CONTAINER BULAN --- */
        .moon-container {
            width: 85vw;
            max-width: 380px;
            
            aspect-ratio: 1 / 1; 
            border-radius: 50%; 
            
            background-image: url('bulan.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 0 50px rgba(255, 255, 230, 0.3), inset 0 0 30px rgba(0,0,0,0.5);
            
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box; 
            z-index: 10;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            
            -webkit-tap-highlight-color: transparent;
            user-select: none; 
            touch-action: manipulation; 
        }

        .moon-container:active {
            transform: scale(0.95);
            box-shadow: 0 0 30px rgba(255, 255, 230, 0.2);
        }

        /* --- TEKS PESAN --- */
        #message {
            font-size: 1.7em;
            color: #ffffff; 
            line-height: 1.2;
            text-align: center;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 1), 0px 0px 10px rgba(0,0,0,0.8);
            opacity: 0; 
            transition: opacity 0.4s ease;
            pointer-events: none; 
            font-weight: normal;
        }

        /* --- COUNTER DAYS --- */
        .day-counter {
            position: absolute;
            bottom: 12%; 
            width: 100%;
            color: #ffffff;
            font-size: 1.5em;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px; 
            pointer-events: none; 
        }

        /* --- BUBBLE CHAT INTERAKTIF DI LOVE HITAM --- */
        .heart-container {
            position: relative;
            cursor: pointer;
            pointer-events: auto; 
            -webkit-tap-highlight-color: transparent;
        }

            position: absolute;
            bottom: 150%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);

            width: max-content;

            text-align: center;
