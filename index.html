<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Menggunakan font piksel yang baru diimpor */
            font-family: 'VT323', 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden; 
            position: relative;
        }

        /* --- BACKGROUND VIDEO --- */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.6);
        }

        .container {
            /* PERBAIKAN RESPONSIVE: Menggunakan aspect-ratio agar selalu bulat sempurna di HP */
            width: 85vw;
            max-width: 380px;
            aspect-ratio: 1 / 1; 
            border-radius: 50%;
            
            background-image: url('bulan.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 0 60px rgba(255, 255, 230, 0.4), inset 0 0 30px rgba(0,0,0,0.3);
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 35px;
            box-sizing: border-box; 
            z-index: 10;
        }

        h1 {
            color: #ff4757; 
            font-size: 2.2em; /* Ukuran disesuaikan untuk font piksel */
            margin-top: 0;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 1px;
        }

        #message {
            font-size: 1.6em; /* Ukuran disesuaikan untuk font piksel */
            color: #ffffff; 
            line-height: 1.3;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Bayangan teks hitam pekat agar sangat kontras di atas gambar bulan */
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.9);
            padding: 0 10px;
        }

        /* --- PERBAIKAN TOMBOL: Menjadi Ikon Love Hitam --- */
        button {
            margin-top: 15px;
            background: transparent; /* Menghilangkan background kotak */
            border: none;
            font-size: 2.8em; /* Mengatur ukuran ikon love */
            cursor: pointer;
            transition: transform 0.2s ease;
            padding: 0;
            line-height: 1;
            outline: none;
            -webkit-tap-highlight-color: transparent; /* Menghilangkan efek biru saat ditekan di HP */
        }

        button:hover {
            transform: scale(1.2); /* Efek sedikit membesar saat diarahkan kursor */
        }

        button:active {
            transform: scale(0.9); /* Efek sedikit mengecil saat diklik */
        }
    </style>
</head>
<body>
    <video autoplay loop muted playsinline id="bg-video">
        <source src="background.mp4" type="video/mp4">
    </video>

    <div class="container">
        <h1>Hai, Sayang ❤️</h1>
        <div id="message">Tunggu sebentar...</div>
        <button onclick="tampilkanPesan()">🖤</button>
    </div>

    <audio id="bg-music" loop>
        <source src="lagu.mp3" type="audio/mpeg">
    </audio>

    <script>
        const pesan = [
            "Aku kangen kamu hari ini.",
            "Jarak cuma angka, perasaanku ke kamu nyata.",
            "Semangat ya hari ini! You got this.",
            "Jangan lupa makan yang bener, aku nggak mau kamu sakit.",
            "Senyum kamu itu hal favorit aku di dunia.",
            "Semoga mimpi indah ya nanti malam, Sayang.",
            "Aku selalu bangga punya kamu.",
            "Inget ya, aku di sini selalu dukung kamu."
        ];

        function tampilkanPesan() {
            if (pesan.length === 0) return; 

            const musik = document.getElementById('bg-music');
            if (musik && musik.paused) {
                musik.play().catch(e => console.log("Audio play failed:", e));
            }

            const indexRandom = Math.floor(Math.random() * pesan.length);
            const messageElement = document.getElementById('message');
            
            messageElement.style.opacity = 0;
            setTimeout(() => {
                messageElement.innerText = pesan[indexRandom];
                messageElement.style.opacity = 1;
            }, 200);
        }

        window.onload = function() {
            document.getElementById('message').style.transition = 'opacity 0.3s ease';
            tampilkanPesan();
        };
    </script>
</body>
</html>
