<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu ❤️</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden; 
            position: relative;
        }

        /* --- KODE UNTUK BACKGROUND VIDEO --- */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Memastikan video memenuhi seluruh layar tanpa merusak rasio */
            z-index: -1; /* Memastikan video berada di urutan paling belakang */
            filter: brightness(0.6); /* Sedikit menggelapkan video agar teks lebih terbaca */
        }

        .container {
            /* Bentuk lingkaran dengan gambar bulan */
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background-image: url('bulan.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 0 60px rgba(255, 255, 230, 0.4), inset 0 0 30px rgba(0,0,0,0.3);
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box; 
            z-index: 10;
        }

        h1 {
            color: #ff4757; 
            font-size: 1.5em;
            margin-top: 0;
            margin-bottom: 15px;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.9);
        }

        #message {
            font-size: 1.2em;
            color: #1a1a1a; 
            font-weight: bold;
            font-style: italic;
            line-height: 1.5;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.8);
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5253 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
            background: linear-gradient(135deg, #ee5253 0%, #ff6b6b 100%);
        }

        button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <video autoplay loop muted playsinline id="bg-video">
        <source src="background.mp4" type="video/mp4">
    </video>

    <div class="container">
        <h1>Hai, Sayang ❤️</h1>
        <div id="message">Tunggu sebentar...</div>
        <button onclick="tampilkanPesan()">Baca Pesan Lainnya</button>
    </div>

    <audio id="bg-music" loop>
        <source src="lagu.mp3" type="audio/mpeg">
    </audio>

    <script>
        const pesan = [
            "Aku kangen kamu hari ini.",
            "Jarak cuma angka, perasaanku ke kamu nyata.",
            "Semangat ya hari ini! You got this.",
            "Jangan lupa makan yang bener, aku nggak mau kamu sakit.",
            "Senyum kamu itu hal favorit aku di dunia.",
            "Semoga mimpi indah ya nanti malam, Sayang.",
            "Aku selalu bangga punya kamu.",
            "Inget ya, aku di sini selalu dukung kamu."
        ];

        function tampilkanPesan() {
            if (pesan.length === 0) return; 

            // Putar musik saat tombol pertama kali ditekan (Opsional)
            const musik = document.getElementById('bg-music');
            if (musik && musik.paused) {
                musik.play().catch(e => console.log("Audio play failed:", e));
            }

            const indexRandom = Math.floor(Math.random() * pesan.length);
            const messageElement = document.getElementById('message');
            
            messageElement.style.opacity = 0;
            setTimeout(() => {
                messageElement.innerText = pesan[indexRandom];
                messageElement.style.opacity = 1;
            }, 200);
        }

        window.onload = function() {
            document.getElementById('message').style.transition = 'opacity 0.3s ease';
            tampilkanPesan();
        };
    </script>
</body>
</html>
