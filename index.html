<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for her</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'VT323', monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            position: relative;
            background-color: #000;
        }

        /* --- BACKGROUND VIDEO --- */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.5);
        }

        /* --- HEADER DI ATAS TENGAH --- */
        h1 {
            position: absolute;
            top: 10%; 
            width: 100%;
            color: #ff4757; 
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), 0 0 5px rgba(255, 255, 255, 0.3);
            margin: 0;
            z-index: 100;
            letter-spacing: 2px;
            pointer-events: none; 
        }

        /* --- CONTAINER UTAMA BULAN --- */
        .moon-container {
            width: 85vw;
            max-width: 380px;
            aspect-ratio: 1 / 1; 
            border-radius: 50%; 
            box-shadow: 0 0 50px rgba(255, 255, 230, 0.3), inset 0 0 30px rgba(0,0,0,0.5);
            
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box; 
            z-index: 10;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative; 
            
            -webkit-tap-highlight-color: transparent;
            user-select: none; 
            touch-action: manipulation; 
        }

        .moon-container:active {
            transform: scale(0.95);
            box-shadow: 0 0 30px rgba(255, 255, 230, 0.2);
        }

        /* --- LAPISAN GAMBAR BULAN (BISA BERPUTAR) --- */
        #moon-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('bulan.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 50%;
            z-index: 1; 
            transition: transform 0.5s ease;
        }

        /* Animasi putar untuk bulan saat lagu menyala */
        @keyframes spinMoon {
            100% { transform: rotate(360deg); }
        }
        .spinning {
            animation: spinMoon 8s linear infinite;
        }

        /* --- TEKS PESAN & LAGU --- */
        #message {
            position: relative;
            z-index: 2; 
            font-size: 1.7em;
            color: #ffffff; 
            line-height: 1.2;
            text-align: center;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 1), 0px 0px 10px rgba(0,0,0,0.8);
            opacity: 0; 
            transition: opacity 0.4s ease;
            font-weight: normal;
            width: 100%;
        }

        .play-btn {
            position: relative;
            z-index: 10;
            display: inline-block;
            font-size: 1.8em;
            margin-top: 15px;
            cursor: pointer;
            transition: transform 0.2s ease;
            filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.8));
            touch-action: manipulation; 
            -webkit-tap-highlight-color: transparent;
        }
        .play-btn:active {
            transform: scale(0.8);
        }

        /* --- COUNTER DAYS --- */
        .day-counter {
            position: absolute;
            bottom: 12%; 
            width: 100%;
            color: #ffffff;
            font-size: 1.5em;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px; 
            pointer-events: none; 
        }

        /* --- BUBBLE CHAT INTERAKTIF DI LOVE HITAM --- */
        .heart-container {
            position: relative;
            cursor: pointer;
            pointer-events: auto; 
            -webkit-tap-highlight-color: transparent;
        }

        .pixel-bubble {
            position: absolute;
            bottom: 150%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background-color: #ff4757; 
            color: #ffffff;
            padding: 8px 12px;
            font-size: 0.6em; 
            line-height: 1.2;
            width: max-content;
            max-width: 200px;
            text-align: center;
            border: 2px solid #ffffff; 
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.6);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, transform 0.3s ease;
            border-radius: 0; 
            z-index: 200;
            letter-spacing: 1px;
            text-shadow: none; 
        }

        .pixel-bubble::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px;
            border-style: solid;
            border-color: #ff4757 transparent transparent transparent; 
        }

        .pixel-bubble.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* --- CSS EFEK BINTANG / BUBU DUDU --- */
        .falling-object {
            position: absolute;
            z-index: 5; 
            pointer-events: none; 
            animation: fallDiagonal linear forwards;
        }

        .star-img {
            width: 150px; 
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
        }

        .bubu-img {
            width: 120px; 
            filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.5));
        }

        @keyframes fallDiagonal {
            0% { transform: translate(0, 0) scale(0.8); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(160vw, 120vh) scale(1); opacity: 0; }
        }
    </style>
</head>

        function dapatkanPesanHariIni() {
            const hariIni = new Date();
            const seedString = hariIni.getFullYear().toString() + hariIni.getMonth().toString() + hariIni.getDate().toString();
            let seed = parseInt(seedString);
            
            let x = Math.sin(seed++) * 10000;
            const indexHariIni = Math.floor((x - Math.floor(x)) * pesan.length);
            return pesan[indexHariIni];
        }

        function jalankanMedia() {
            const video = document.getElementById('bg-video');
            if (video && video.paused) video.play().catch(e => console.log(e));
        }

        // --- FUNGSI PLAY/PAUSE DIPERBAIKI ---
        function toggleMusic(e) {
            e.preventDefault();
            e.stopPropagation(); // Mencegah terpicunya skip kata-kata
            const musik = document.getElementById('music-player');

            if (musik.paused) {
                // Menangani error jika file belum beres loading
                const playPromise = musik.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => console.log("Menunggu audio siap...", error));
                }
            } else {
                musik.pause();
            }
        }

        function renderPesan(dataObj) {
            const messageElement = document.getElementById('message');
            const musik = document.getElementById('music-player');

            // Selalu matikan musik saat berpindah (UI akan otomatis ter-update berkat event listener)
            musik.pause();

            if (dataObj.type === 'song') {
                musik.src = dataObj.file;
                messageElement.innerHTML = `
                    <div style="font-size: 0.8em; color: #ffeb3b; letter-spacing: 1px; text-transform: uppercase;">🎵 ${dataObj.artist}</div>
                    <div style="font-size: 1.2em; font-weight: bold; margin: 15px 0;">${dataObj.title}</div>
                    <div class="play-btn" onclick="toggleMusic(event)" id="play-btn-icon">▶️</div>
                `;
            } else {
                messageElement.innerHTML = `"${dataObj.text}"`;
            }
        }

        function handleMoonClick() {
            clickCount++;

            if (clickCount === 1) {
                clickTimer = setTimeout(() => {
                    jalankanMedia(); 
                    if (pertamaKaliKlik) {
                        renderPesan(dapatkanPesanHariIni());
                        document.getElementById('message').style.opacity = 1;
                        pertamaKaliKlik = false;
                    }
                    clickCount = 0; 
                }, 300); 

            } else if (clickCount === 2) {
                clearTimeout(clickTimer); 
                jalankanMedia(); 

                const messageElement = document.getElementById('message');

                if (pertamaKaliKlik) {
                    renderPesan(dapatkanPesanHariIni());
                    messageElement.style.opacity = 1;
                    pertamaKaliKlik = false;
                } else {
                    const indexRandom = Math.floor(Math.random() * pesan.length);
                    messageElement.style.opacity = 0;
                    
                    setTimeout(() => {
                        renderPesan(pesan[indexRandom]);
                        messageElement.style.opacity = 1;
                    }, 250);
                }
                clickCount = 0; 
            }
        }

        function hitungHari() {
            const tanggalMulai = new Date("2026-05-30"); 
            const hariMulaiNilai = 129; 
            
            const hariIni = new Date();
            tanggalMulai.setHours(0,0,0,0);
            hariIni.setHours(0,0,0,0);
            
            const selisihWaktu = hariIni.getTime() - tanggalMulai.getTime();
            const selisihHari = Math.floor(selisihWaktu / (1000 * 60 * 60 * 24));
            
            document.getElementById('days-count').innerText = hariMulaiNilai + selisihHari;
        }

        function toggleBubble(e) {
            e.stopPropagation(); 
            const bubble = document.getElementById('heart-bubble');
            bubble.classList.add('show');
            if (bubbleTimer) clearTimeout(bubbleTimer);
            bubbleTimer = setTimeout(() => {
                bubble.classList.remove('show');
            }, 3000);
        }

        window.onload = function() {
            hitungHari();
        };

        // --- INTERAKSI BACKGROUND ---
        document.body.addEventListener('click', function(e) {
            const bubble = document.getElementById('heart-bubble');
            if (bubble && bubble.classList.contains('show') && !e.target.closest('.heart-container')) {
                bubble.classList.remove('show');
            }

            if (e.target.closest('.moon-container') || e.target.closest('.heart-container') || e.target.closest('.play-btn')) {
                return;
            }

            jalankanMedia();

            const flyingObj = document.createElement('img');
            const isBubu = Math.random() < 0.20; 
            
            flyingObj.src = isBubu ? 'bubududu.png' : 'star.png';
            flyingObj.className = 'falling-object ' + (isBubu ? 'bubu-img' : 'star-img');

            const randomY = Math.floor(Math.random() * 30) - 10;
            flyingObj.style.top = randomY + 'vh';
            flyingObj.style.left = '-20vw'; 

            const animationDuration = (Math.random() * 1 + 1.5).toFixed(2);
            flyingObj.style.animationDuration = animationDuration + 's';

            document.body.appendChild(flyingObj);

            setTimeout(() => {
                flyingObj.remove();
            }, animationDuration * 1000);
        });
    </script>
</body>
</html>
